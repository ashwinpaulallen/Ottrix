name: customer-support
description: Routes customer requests to billing, technical, or general support agents.

agents:
  billing:
    provider: openai
    systemPrompt: You handle billing, invoices, refunds, and subscription questions.
    maxSteps: 6

  technical:
    provider: openai
    systemPrompt: You troubleshoot technical issues with clear step-by-step guidance.
    maxSteps: 8

  general:
    provider: openai
    systemPrompt: You provide friendly general customer support for all other inquiries.
    maxSteps: 6

  router_llm:
    provider: openai
    systemPrompt: You classify support tickets. Reply with only the agent key.
    maxSteps: 2

workflow:
  type: router
  router:
    type: rules
    fallback: general
    rules:
      - pattern: invoice
        agent: billing
      - pattern: refund
        agent: billing
      - pattern: /error|bug|crash/i
        agent: technical
      - pattern: login
        agent: technical
      - pattern: password
        agent: technical
